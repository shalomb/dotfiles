# Comprehensive Goss bash testing with different shell contexts
# Goss runs from one context but tests different bash contexts

file:
  # File structure validation
  /home/unop/.bashrc:
    exists: true
  /home/unop/.config/bash/aliases:
    exists: true
  /home/unop/.config/bash/lib:
    exists: true
    filetype: directory
  /home/unop/.config/bash/enabled:
    exists: true
    filetype: directory

command:
  # === NON-INTERACTIVE CONTEXT TESTS ===
  
  # Universal functions should be available in non-interactive shells
  "env -u SSH_CLIENT -u SSH_TTY bash -c 'source ~/.bashrc && type has-cmd'":
    exit-status: 0
    timeout: 3000
    
  "env -u SSH_CLIENT -u SSH_TTY bash -c 'source ~/.bashrc && type @has-cmd'":
    exit-status: 0
    timeout: 3000
    
  "env -u SSH_CLIENT -u SSH_TTY bash -c 'source ~/.bashrc && type defined'":
    exit-status: 0
    timeout: 3000
    
  "env -u SSH_CLIENT -u SSH_TTY bash -c 'source ~/.bashrc && type dotfiles'":
    exit-status: 0
    timeout: 3000
    
  # reload function should NOT be available in non-interactive shells
  "env -u SSH_CLIENT -u SSH_TTY bash -c 'source ~/.bashrc && type reload 2>/dev/null'":
    exit-status: 1
    timeout: 3000
    
  # Aliases should NOT be loaded in non-interactive shells (< 10 aliases)
  "env -u SSH_CLIENT -u SSH_TTY bash -c 'source ~/.bashrc >/dev/null 2>&1; test $(alias | wc -l) -lt 10'":
    exit-status: 0
    timeout: 3000
      
  # === INTERACTIVE CONTEXT TESTS ===
  
  # reload function should be available in interactive shells
  "bash -i -c 'source ~/.bashrc && type reload'":
    exit-status: 0
    timeout: 5000
    
  # Aliases should be loaded in interactive shells (50+ aliases)
  "bash -i -c 'source ~/.bashrc && test $(alias | wc -l) -gt 50'":
    exit-status: 0
    timeout: 5000
      
  # dotfiles helpers should be available
  "bash -i -c 'source ~/.bashrc && type _dotfiles_help'":
    exit-status: 0
    timeout: 5000
    
  # === LOGIN SHELL CONTEXT TESTS ===
  
  # Login shells should have interactive features
  "bash -l -i -c 'type reload'":
    exit-status: 0
    timeout: 5000
    
  # PATH should be set correctly in login shells
  "bash -l -c 'echo \$PATH | grep -q \$HOME/.local/bin'":
    exit-status: 0
    timeout: 3000
    
  # === SSH CONTEXT TESTS ===
  
  # SSH context should load interactive features even in non-interactive mode
  "SSH_CLIENT='test' bash -c 'source ~/.bashrc && type reload'":
    exit-status: 0
    timeout: 5000
    
  # === PERFORMANCE TESTS ===
  
  # Non-interactive startup should be fast
  "timeout 1s env -u SSH_CLIENT -u SSH_TTY bash -c 'source ~/.bashrc'":
    exit-status: 0
    timeout: 2000
    
  # === ESSENTIAL COMMANDS ===
  
  "which delta":
    exit-status: 0
    timeout: 1000
    
  "which gum":
    exit-status: 0
    timeout: 1000
    
  "which rustup":
    exit-status: 0
    timeout: 1000
