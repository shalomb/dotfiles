# Comprehensive Goss bash testing with different shell contexts
# Goss runs from one context but tests different bash contexts

file:
  # File structure validation
  /home/unop/.bashrc:
    exists: true
  /home/unop/.config/bash/aliases:
    exists: true
  /home/unop/.config/bash/lib:
    exists: true
    filetype: directory
  /home/unop/.config/bash/enabled:
    exists: true
    filetype: directory

command:
  # === NON-INTERACTIVE CONTEXT TESTS ===
  
  # Universal functions should be available in non-interactive shells
  "env -u SSH_CLIENT -u SSH_TTY bash -c 'source ~/.bashrc && type has-cmd'":
    exit-status: 0
    timeout: 3000
    
  "env -u SSH_CLIENT -u SSH_TTY bash -c 'source ~/.bashrc && type @has-cmd'":
    exit-status: 0
    timeout: 3000
    
  "env -u SSH_CLIENT -u SSH_TTY bash -c 'source ~/.bashrc && type defined'":
    exit-status: 0
    timeout: 3000
    
  "env -u SSH_CLIENT -u SSH_TTY bash -c 'source ~/.bashrc && type dotfiles'":
    exit-status: 0
    timeout: 3000
    
  # reload function should NOT be available in non-interactive shells
  "env -u SSH_CLIENT -u SSH_TTY bash -c 'source ~/.bashrc && type reload 2>/dev/null'":
    exit-status: 1
    timeout: 3000
    
  # Aliases should NOT be loaded in non-interactive shells (< 10 aliases)
  "env -u SSH_CLIENT -u SSH_TTY bash -c 'source ~/.bashrc >/dev/null 2>&1; test $(alias | wc -l) -lt 10'":
    exit-status: 0
    timeout: 3000
      
  # === INTERACTIVE CONTEXT TESTS ===

  # reload function should be available in interactive shells
  "setsid bash -i -c 'source ~/.bashrc && type reload' </dev/null 2>&1":
    exit-status: 0
    timeout: 20000

  # Aliases should be loaded in interactive shells (50+ aliases)
  "setsid bash -i -c 'source ~/.bashrc && test $(alias | wc -l) -gt 50' </dev/null 2>&1":
    exit-status: 0
    timeout: 20000

  # dotfiles helpers should be available
  "setsid bash -i -c 'source ~/.bashrc && type _dotfiles_help' </dev/null 2>&1":
    exit-status: 0
    timeout: 20000

  # `time` output format must be configured (regression: dropped in cb2c19d)
  "setsid bash -i -c 'source ~/.bashrc >/dev/null 2>&1; declare -p TIMEFORMAT' </dev/null 2>&1":
    exit-status: 0
    stdout:
      - "Real:"
      - "%3lR"
    timeout: 20000

  # === LOGIN SHELL CONTEXT TESTS ===

  # Login shells should have interactive features
  "setsid bash -l -i -c 'type reload' </dev/null 2>&1":
    exit-status: 0
    timeout: 20000

  # PATH should be set correctly in login shells (hermetic: a parent that
  # already exported PATH_SET_BY_PROFILE with a stripped PATH must not matter)
  "env -i HOME=$HOME bash -l -c 'echo $PATH | grep -q $HOME/.local/bin'":
    exit-status: 0
    timeout: 20000
    
  # === SSH CONTEXT TESTS ===

  # SSH contexts deliberately continue into the interactive section even when
  # non-interactive (7580f8a: they may become interactive), so reload exists.
  "SSH_CLIENT='test' bash -c 'source ~/.bashrc && type reload 2>/dev/null'":
    exit-status: 0
    timeout: 20000

  # === AGENT STATUS DISPLAY ===

  # Startup is silent (7580f8a) but agentctl must be available and wired up
  "setsid bash -i -c 'type agentctl' </dev/null 2>&1":
    exit-status: 0
    stdout:
      - "agentctl is a function"
    timeout: 20000

  "rg -q 'agentctl init' ~/.config/bash/enabled/agentctl-integration.sh":
    exit-status: 0
    timeout: 1000

  # === ESSENTIAL COMMANDS ===
  
  "which delta":
    exit-status: 0
    timeout: 1000
    
  "which gum":
    exit-status: 0
    timeout: 1000
    
  "which rustup":
    exit-status: 0
    timeout: 1000
