# TMux-safe Goss bash testing - avoids interactive shell conflicts

file:
  /home/unop/.bashrc:
    exists: true
  /home/unop/.config/bash/aliases:
    exists: true
  /home/unop/.config/bash/lib:
    exists: true
    filetype: directory
  /home/unop/.config/bash/enabled:
    exists: true
    filetype: directory

command:
  # === ESSENTIAL COMMANDS (no shell sourcing) ===
  "which delta":
    exit-status: 0
    timeout: 2000
    
  "which gum":
    exit-status: 0
    timeout: 2000
    
  "which rustup":
    exit-status: 0
    timeout: 2000
    
  # === BASH SYNTAX VALIDATION ===
  "bash -n ~/.bashrc":
    exit-status: 0
    timeout: 2000
    
  # === SSH/GPG AGENTS ===
  "ssh-add -l":
    exit-status: 0
    timeout: 2000
    stdout:
      - "256 SHA256"
      
  "gpg --version":
    exit-status: 0
    timeout: 2000
    stdout:
      - "GnuPG"
      
  # === BASIC FUNCTION AVAILABILITY (no interactive shells) ===
  "bash -c 'source ~/.bashrc >/dev/null 2>&1 && type has-cmd >/dev/null'":
    exit-status: 0
    timeout: 10000
    
  "bash -c 'source ~/.bashrc >/dev/null 2>&1 && type defined >/dev/null'":
    exit-status: 0
    timeout: 10000
