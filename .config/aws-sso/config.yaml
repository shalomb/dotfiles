SSOConfig:
  tec:
    SSORegion: us-east-1
    StartUrl: https://d-90677b2a7e.awsapps.com/start
    DefaultRegion: us-east-1
DefaultRegion: us-east-1
ConsoleDuration: 720
CacheRefresh: 168
AutoConfigCheck: true
UrlAction: printurl
ConfigProfilesUrlAction: printurl
UrlExecCommand:
  - x-www-browser # bin/open
  - "%s"
LogLevel: info #debug
HistoryLimit: 1024
HistoryMinutes: 1440
# Use device-code flow (poll AWS) instead of PKCE localhost callback; needed when browser runs on a different host than this VM
AuthWorkflow: device_code
