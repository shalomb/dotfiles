[project]
name = "cursor-agent-patch"
version = "1.0.0"
description = "Robust Python-based patch for cursor-agent bash initialization issues"
authors = [
    {name = "Dotfiles Team", email = "unop@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
cursor-agent-patch = "patch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["patch"]