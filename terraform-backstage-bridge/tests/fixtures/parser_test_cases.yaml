      title: Boolean with string default
      description: Boolean with string default
      type: boolean
      default: 'false'
- name: list_with_empty_default
  description: List variable with empty array default
  terraform_input: "variable \"security_groups_empty\" {\n  description = \"The Security Groups to be attached on the EC2(s)\"\
    \n  type        = list(string)\n  default     = []\n}"
  expected_result:
    security_groups_empty:
      name: security_groups_empty
      type: ListType(PrimitiveType('string'))
      description: The Security Groups to be attached on the EC2(s)
      default: &id001 []
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
