# Test cases for Terraform parser validation
test_cases:
- name: basic_string_variable
  description: Simple string variable with default value
  terraform_input: "variable \"environment\" {\n  description = \"Environment name\"\n  type        = string\n  default  \
    \   = \"dev\"\n}"
  expected_result:
    environment:
      name: environment
      type: PrimitiveType('string')
      description: Environment name
      default: dev
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    environment:
      title: Environment name
      description: Environment name
      type: string
      default: dev
- name: required_string_variable
  description: Required string variable without default
  terraform_input: "variable \"instance_id\" {\n  description = \"EC2 instance ID\"\n  type        = string\n}"
  expected_result:
    instance_id:
      name: instance_id
      type: PrimitiveType('string')
      description: EC2 instance ID
      default: null
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    instance_id:
      title: EC2 instance ID
      description: EC2 instance ID
      type: string
- name: number_variable
  description: Number variable with default
  terraform_input: "variable \"port\" {\n  description = \"Port number\"\n  type        = number\n  default     = 8080\n}"
  expected_result:
    port:
      name: port
      type: PrimitiveType('number')
      description: Port number
      default: 8080
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    port:
      title: Port number
      description: Port number
      type: number
      default: 8080
- name: boolean_variable
  description: Boolean variable with default
  terraform_input: "variable \"enable_ssl\" {\n  description = \"Enable SSL\"\n  type        = bool\n  default     = true\n\
    }"
  expected_result:
    enable_ssl:
      name: enable_ssl
      type: PrimitiveType('bool')
      description: Enable SSL
      default: true
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    enable_ssl:
      title: Enable SSL
      description: Enable SSL
      type: boolean
      default: true
      ui:widget: radio
      ui:options:
        inline: true
- name: list_of_strings
  description: List of strings variable with default
  terraform_input: "variable \"security_groups\" {\n  description = \"List of security group IDs\"\n  type        = list(string)\n\
    \  default     = [\"sg-12345\", \"sg-67890\"]\n}"
  expected_result:
    security_groups:
      name: security_groups
      type: ListType(PrimitiveType('string'))
      description: List of security group IDs
      default:
      - sg-12345
      - sg-67890
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    security_groups:
      title: List of security group IDs
      description: List of security group IDs
      type: array
      items:
        type: string
      default:
      - sg-12345
      - sg-67890
- name: map_of_strings
  description: Map of strings variable with default
  terraform_input: "variable \"tags\" {\n  description = \"Resource tags\"\n  type        = map(string)\n  default     = {\n\
    \    Environment = \"dev\"\n    Owner       = \"team\"\n  }\n}"
  expected_result:
    tags:
      name: tags
      type: MapType(PrimitiveType('string'))
      description: Resource tags
      default:
        Environment: dev
        Owner: team
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    tags:
      title: Resource tags
      description: Resource tags
      type: object
      additionalProperties:
        type: string
      default:
        Environment: dev
        Owner: team
- name: set_of_strings
  description: Set of strings variable with default
  terraform_input: "variable \"allowed_regions\" {\n  description = \"Set of allowed AWS regions\"\n  type        = set(string)\n\
    \  default     = [\"us-east-1\", \"us-west-2\"]\n}"
  expected_result:
    allowed_regions:
      name: allowed_regions
      type: SetType(PrimitiveType('string'))
      description: Set of allowed AWS regions
      default:
      - us-east-1
      - us-west-2
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    allowed_regions:
      title: Set of allowed AWS regions
      description: Set of allowed AWS regions
      type: array
      uniqueItems: true
      default:
      - us-east-1
      - us-west-2
      ui:help: Enter unique items, one per line
      ui:widget: textarea
- name: number_with_null_default
  description: Number variable with explicit null default
  terraform_input: "variable \"root_volume_size_null\" {\n  description = \"Size for the root EBS volume\"\n  type       \
    \ = number\n  default     = null\n}"
  expected_result:
    root_volume_size_null:
      name: root_volume_size_null
      type: PrimitiveType('number')
      description: Size for the root EBS volume
      default: null
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    root_volume_size_null:
      title: Size for the root EBS volume
      description: Size for the root EBS volume
      type: number
- name: number_with_negative_default
  description: Number variable with negative default value
  terraform_input: "variable \"root_volume_size_negative\" {\n  description = \"Size for the root EBS volume\"\n  type   \
    \     = number\n  default     = -1\n}"
  expected_result:
    root_volume_size_negative:
      name: root_volume_size_negative
      type: PrimitiveType('number')
      description: Size for the root EBS volume
      default: -1
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    root_volume_size_negative:
      title: Size for the root EBS volume
      description: Size for the root EBS volume
      type: number
      default: -1
- name: boolean_with_string_false
  description: Boolean variable with string "false" default
  terraform_input: "variable \"bool_var_false\" {\n  description = \"Boolean with string default\"\n  type        = bool\n\
    \  default     = \"false\"\n}"
  expected_result:
