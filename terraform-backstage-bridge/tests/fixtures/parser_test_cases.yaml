- name: comprehensive_all_attributes
  description: Test variable with all possible attributes including multiple validation rules
  terraform_input: "variable \"comprehensive_variable\" {\n  description = \"A comprehensive variable with all attributes\"\
    \n  type = object({\n    string_field = string\n    number_field = number\n    bool_field   = bool\n  })\n  default =\
    \ {\n    string_field = \"default_string\"\n    number_field = 42\n    bool_field   = true\n  }\n  sensitive = true\n\
