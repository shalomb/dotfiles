      title: The Security Groups to be attached on the EC2(s)
      description: The Security Groups to be attached on the EC2(s)
      type: array
      default: *id001
- name: map_with_complex_default
  description: Map variable with complex multi-field default
  terraform_input: "variable \"metadata_options\" {\n  description = \"Customize the metadata options of the instance\"\n\
    \  type        = map(string)\n  default     = {\n    http_endpoint               = \"enabled\"\n    http_put_response_hop_limit\
    \ = \"1\"\n    http_tokens                 = \"optional\"\n    instance_metadata_tags      = \"disabled\"\n  }\n}"
  expected_result:
    metadata_options:
      name: metadata_options
      type: MapType(PrimitiveType('string'))
      description: Customize the metadata options of the instance
      default:
        http_endpoint: enabled
        http_put_response_hop_limit: '1'
        http_tokens: optional
        instance_metadata_tags: disabled
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    metadata_options:
      title: Customize the metadata options of the instance
      description: Customize the metadata options of the instance
      type: object
      additionalProperties:
        type: string
      default:
        http_endpoint: enabled
        http_put_response_hop_limit: '1'
        http_tokens: optional
        instance_metadata_tags: disabled
- name: type_inference_from_empty_list
