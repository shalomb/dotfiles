      title: "  If true, the launched EC2 instance will have detailed monitoring enabled.\n  This may incur additional costs."
      description: "  If true, the launched EC2 instance will have detailed monitoring enabled.\n  This may incur additional\
        \ costs."
      type: boolean
      default: false
