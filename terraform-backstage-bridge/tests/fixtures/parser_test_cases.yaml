      title: Custom lifecycle rules null
      description: Custom lifecycle rules null
      type: string
- name: sensitive_variable
  description: Variable with sensitive attribute
  terraform_input: "variable \"flexible_config\" {\n  description = \"Configuration that can be any type\"\n  type       \
    \ = any\n  sensitive   = true\n  nullable    = false\n}"
  expected_result:
    flexible_config:
      name: flexible_config
      type: AnyType()
      description: Configuration that can be any type
      default: null
      sensitive: true
      nullable: false
      validations: []
  harness_expected_result:
    flexible_config:
      title: Configuration that can be any type
      description: Configuration that can be any type
      type: string
- name: variable_with_single_validation
  description: Variable with single validation rule
  terraform_input: "variable \"os\" {\n  description = \"The OS for the EC2(s)\"\n  type        = string\n  default     =\
    \ \"RHEL8\"\n  validation {\n    condition     = contains([\"RHEL9\", \"RHEL8\", \"RHEL7\", \"Windows2019\", \"Windows2016\"\
    , \"AZL2\"], var.os)\n    error_message = \"Not a valid operating system!\"\n  }\n}"
  expected_result:
    os:
      name: os
      type: PrimitiveType('string')
      description: The OS for the EC2(s)
      default: RHEL8
      sensitive: false
      nullable: true
      validations:
      - condition: contains(["RHEL9", "RHEL8", "RHEL7", "Windows2019", "Windows2016", "AZL2"], var.os)
        error_message: Not a valid operating system!
  harness_expected_result:
    os:
      title: The OS for the EC2(s)
      description: The OS for the EC2(s)
      type: string
      default: RHEL8
      enum:
      - RHEL9
      - RHEL8
      - RHEL7
      - Windows2019
      - Windows2016
      - AZL2
      ui:widget: select
- name: variable_with_multiple_validations
  description: Variable with multiple validation rules
  terraform_input: "variable \"instance_type\" {\n  description = \"The size for the EC2(s)\"\n  type        = string\n  validation\
    \ {\n    condition     = lower(var.instance_type) == var.instance_type\n    error_message = \"`instance_type` must be\
    \ in lower-case\"\n  }\n  validation {\n    condition     = contains([\"t3.micro\", \"t3.small\", \"t3.medium\"], var.instance_type)\n\
    \    error_message = \"Instance type must be t3.micro, t3.small, or t3.medium\"\n  }\n}"
  expected_result:
    instance_type:
      name: instance_type
      type: PrimitiveType('string')
      description: The size for the EC2(s)
      default: null
      sensitive: false
      nullable: true
      validations:
      - condition: lower(var.instance_type) == var.instance_type
        error_message: '`instance_type` must be in lower-case'
      - condition: contains(["t3.micro", "t3.small", "t3.medium"], var.instance_type)
        error_message: Instance type must be t3.micro, t3.small, or t3.medium
  harness_expected_result:
    instance_type:
      title: The size for the EC2(s)
      description: The size for the EC2(s)
      type: string
      enum:
      - t3
      - micro
      - t3
      - small
      - t3
      - medium
      ui:widget: select
- name: tuple_type_mixed_elements
  description: Tuple type with mixed primitive elements
  terraform_input: "variable \"deployment_matrix\" {\n  description = \"Deployment configuration tuple\"\n  type        =\
    \ tuple([string, number, bool])\n  default     = [\"blue\", 2, true]\n}"
  expected_result:
    deployment_matrix:
      name: deployment_matrix
      type: TupleType([PrimitiveType('string'), PrimitiveType('number'), PrimitiveType('bool')])
      description: Deployment configuration tuple
      default:
      - blue
      - 2
      - true
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    deployment_matrix:
      title: Deployment configuration tuple
      description: Deployment configuration tuple
      type: string
      default:
      - blue
      - 2
      - true
      ui:help: 'Complex type: TupleType([PrimitiveType(''string''), PrimitiveType(''number''), PrimitiveType(''bool'')])'
      ui:widget: textarea
- name: object_type_with_attributes
  description: Object type with mixed primitive attributes
  terraform_input: "variable \"server_config\" {\n  description = \"Server configuration\"\n  type = object({\n    name  \
    \ = string\n    age    = number\n    active = bool\n  })\n  default = {\n    name   = \"server-01\"\n    age    = 5\n\
    \    active = true\n  }\n}"
  expected_result:
    server_config:
      name: server_config
      type: 'ObjectType({name: PrimitiveType(''string''), age: PrimitiveType(''number''), active: PrimitiveType(''bool'')})'
      description: Server configuration
      default:
        name: server-01
        age: 5
        active: true
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    server_config:
      title: Server configuration
      description: Server configuration
      type: object
      default:
        name: server-01
        age: 5
        active: true
      properties:
        name:
          title: Name
          type: string
        age:
          title: Age
          type: number
        active:
          title: Active
          type: boolean
          ui:widget: radio
          ui:options:
            inline: true
- name: nested_list_of_objects
  description: Nested type - list of objects with attributes
  terraform_input: "variable \"services\" {\n  description = \"List of service configurations\"\n  type = list(object({\n\
    \    name = string\n    port = number\n  }))\n  default = [\n    {\n      name = \"web\"\n      port = 80\n    },\n  \
    \  {\n      name = \"api\"\n      port = 8080\n    }\n  ]\n}"
  expected_result:
    services:
      name: services
      type: 'ListType(ObjectType({name: PrimitiveType(''string''), port: PrimitiveType(''number'')}))'
      description: List of service configurations
      default:
      - name: web
        port: 80
      - name: api
        port: 8080
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    services:
      title: List of service configurations
      description: List of service configurations
      type: array
      items:
        type: object
        properties:
          name:
            title: Name
            type: string
          port:
            title: Port
            type: number
      default:
      - name: web
        port: 80
      - name: api
        port: 8080
- name: type_string_representation_validation
  description: Validate type string representations for all basic types
  terraform_input: "variable \"comprehensive_types\" {\n  description = \"Variable showcasing different type representations\"\
    \n  type = object({\n    str_field    = string\n    num_field    = number\n    bool_field   = bool\n    any_field    =\
    \ any\n    list_field   = list(string)\n    set_field    = set(string)\n    map_field    = map(string)\n  })\n}"
  expected_result:
    comprehensive_types:
      name: comprehensive_types
      type: 'ObjectType({str_field: PrimitiveType(''string''), num_field: PrimitiveType(''number''), bool_field: PrimitiveType(''bool''),
        any_field: AnyType(), list_field: ListType(PrimitiveType(''string'')), set_field: SetType(PrimitiveType(''string'')),
        map_field: MapType(PrimitiveType(''string''))})'
      description: Variable showcasing different type representations
      default: null
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    comprehensive_types:
      title: Variable showcasing different type representations
      description: Variable showcasing different type representations
      type: string
- name: complex_nested_load_balancer
  description: Complex nested object structure with list of objects
  terraform_input: "variable \"load_balancer_config\" {\n  description = \"Load balancer configuration\"\n  type = object({\n\
    \    name = string\n    listeners = list(object({\n      port     = number\n      protocol = string\n      ssl_cert =\
    \ string\n    }))\n    health_check = object({\n      path                = string\n      interval            = number\n\
    \      healthy_threshold   = number\n      unhealthy_threshold = number\n    })\n  })\n}"
  expected_result:
    load_balancer_config:
      name: load_balancer_config
      type: 'ObjectType({name: PrimitiveType(''string''), listeners: ListType(ObjectType({port: PrimitiveType(''number''),
        protocol: PrimitiveType(''string''), ssl_cert: PrimitiveType(''string'')})), health_check: ObjectType({path: PrimitiveType(''string''),
        interval: PrimitiveType(''number''), healthy_threshold: PrimitiveType(''number''), unhealthy_threshold: PrimitiveType(''number'')})})'
      description: Load balancer configuration
      default: null
      sensitive: false
      nullable: true
      validations: []
  harness_expected_result:
    load_balancer_config:
      title: Load balancer configuration
      description: Load balancer configuration
      type: object
      properties:
        name:
          title: Name
          type: string
        listeners:
          title: Listeners
          type: array
          items:
            type: object
            properties:
              port:
                title: Port
                type: number
              protocol:
                title: Protocol
                type: string
              ssl_cert:
                title: Ssl Cert
                type: string
          ui:help: Enter one item per line
          ui:widget: textarea
        health_check:
          title: Health Check
          type: object
          properties:
            path:
              title: Path
              type: string
            interval:
              title: Interval
              type: number
            healthy_threshold:
              title: Healthy Threshold
              type: number
            unhealthy_threshold:
              title: Unhealthy Threshold
              type: number
- name: multiline_heredoc_description
