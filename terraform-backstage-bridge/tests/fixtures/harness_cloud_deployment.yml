              default: null
            domain_name:
              type: string
              description: The name of top-level domain  [code docs..>](https://github.com/oneTakeda/terraform-aws-ACMCertificate/blob/main/variables.tf#:~:text=variable%20%22domain_name%22)
              default: null
            subject_alternative_names:
              type: array
              description: SANs for the certificate. Only the same top-level domain SANs are currently supported!  [code docs..>](https://github.com/oneTakeda/terraform-aws-ACMCertificate/blob/main/variables.tf#:~:text=variable%20%22subject_alternative_names%22)
              uniqueItems: false
              minItems: 0
