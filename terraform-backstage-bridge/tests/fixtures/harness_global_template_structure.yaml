# Harness global template structure for testing
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: terraform-template
  title: Terraform Template
  tags:
  - terraform
  - infrastructure
spec:
  owner: platform-team
  type: service
  parameters:
  - title: Resource Configuration
    required:
    - resources
    properties:
      resources:
        title: Terraform Resources
        description: Configuration for all Terraform resources
        type: array
        minItems: 1
        items:
          type: object
  steps:
  - id: fetch-base
    name: Fetch Base
    action: fetch:template
  - id: publish
    name: Publish
    action: publish:github
  - id: register
    name: Register
    action: catalog:register
