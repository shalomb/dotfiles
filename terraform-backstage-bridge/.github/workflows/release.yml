name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Run full validation
      run: make validate

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --extra dev

    - name: Verify version matches tag
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        PROJECT_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "Tag version: $TAG_VERSION"
        echo "Project version: $PROJECT_VERSION"
        if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
          echo "Version mismatch! Tag: $TAG_VERSION, Project: $PROJECT_VERSION"
          exit 1
        fi

    - name: Build package
      run: uv build

    - name: Verify package contents
      run: |
        uv run python -m tarfile -l dist/*.tar.gz
        uv run python -c "
        import zipfile
        import glob
        for wheel in glob.glob('dist/*.whl'):
            with zipfile.ZipFile(wheel, 'r') as z:
                print(f'Contents of {wheel}:')
                for name in z.namelist():
                    print(f'  {name}')
        "

    - name: Test package installation
      run: |
        # Test installation in a clean environment
        uv venv test-env
        source test-env/bin/activate
        uv pip install dist/*.whl
        terraform-parser --version
        terraform-parser tests/fixtures/simple_variables.tf

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # Using trusted publishing - no API token needed
        # Configure at: https://pypi.org/manage/account/publishing/

  create-release:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Extract release notes
      id: extract-notes
      run: |
        # Extract version from tag
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

        # Try to extract release notes from CHANGELOG.md if it exists
        if [ -f CHANGELOG.md ]; then
          # Extract notes between version headers
          sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '$d' > release-notes.md
          if [ -s release-notes.md ]; then
            echo "notes_file=release-notes.md" >> $GITHUB_OUTPUT
          else
            echo "notes_file=" >> $GITHUB_OUTPUT
          fi
        else
          echo "notes_file=" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ steps.extract-notes.outputs.version }}
        body_path: ${{ steps.extract-notes.outputs.notes_file }}
        files: |
          dist/*.whl
          dist/*.tar.gz
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        generate_release_notes: ${{ steps.extract-notes.outputs.notes_file == '' }}
