<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><style>:root{--bg:#faf9f5;--ink:#1d1b16;--mut:#6b675d;--line:#e4e0d4;--acc:#d9704f;--R:#c0392b;--A:#b7791f;--G:#2f7d57;--N:#8a8f98}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:0 auto;padding:36px 28px 60px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:700}h1{font:400 36px/1.15 Georgia,serif;margin:10px 0 12px;max-width:880px}h2{font:400 25px Georgia,serif;margin:40px 0 6px}.lede{font:18px/1.55 Georgia,serif;color:#4a463e;max-width:840px}.sub{color:var(--mut);margin:0 0 14px;max-width:800px}.card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:16px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.kpi b{display:block;font:400 32px Georgia,serif}.kpi span{color:var(--mut);font-size:14px}.badge{display:inline-block;color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:5px;text-transform:uppercase}.l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:14px 0 4px}.need{background:#f8eedb;border-left:4px solid var(--A);padding:8px 12px;border-radius:4px}.gate{border:1.5px dashed var(--acc);border-radius:12px;padding:10px 14px;margin-top:30px;color:#6b3b2a;background:#fdf3ee;font-size:14px}.foot{color:var(--mut);font-size:13px;margin-top:22px;max-width:840px}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:10px 12px;background:#f3f1e9}td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.opt{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:16px}.opt.rec{border-color:var(--G);box-shadow:0 0 0 2px #2f7d5722}.opt h3{font:400 21px Georgia,serif;margin:6px 0}.opt ul{margin:6px 0;padding-left:18px;font-size:14px}.g{color:var(--G)}.c{color:var(--R)}
.clock{display:flex;gap:18px;align-items:center}.bar{flex:1;height:14px;background:#eee9da;border-radius:7px;position:relative}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--A)}.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--R)}
.rec2{background:#fff;border:1px solid var(--line);border-left:5px solid var(--G);border-radius:10px;padding:14px 18px}pre{white-space:pre-wrap;font:14px/1.5 ui-monospace,monospace;background:#f3f1e9;border-radius:10px;padding:14px}
.gloss dt{font-weight:700;margin-top:6px}.gloss dd{margin:0 0 0 0;color:var(--mut);font-size:14px}.tag{font-size:11px;font-weight:700;color:var(--A);letter-spacing:.08em;text-transform:uppercase}</style></head><body><main>
<div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="lede" id="lede"></p>
<div class="kpis" id="kpis"></div>
<h2>How long we have</h2><div class="card clock" id="clock"></div><p class="sub" id="clocknote" style="margin-top:8px"></p>
<h2>The ways forward</h2><div class="opts" id="opts"></div>
<h2>Why this one</h2><div class="rec2" id="why"></div>
<h2>What I need, and from whom</h2><table id="needs"><thead><tr><th>I need</th><th>From</th><th>By</th></tr></thead><tbody></tbody></table>
<div id="replybox"></div>
<div id="glossbox"></div>
<div class="gate"><b>Nothing here is approved.</b> Read-only: nothing is posted, deleted, renewed or changed by this page. A human decides.</div>
<p class="foot" id="foot"></p></main>
<script>
const DATA=__DATA__;
function el(t,a,k){const e=document.createElement(t);for(const x in (a||{})){x==="text"?e.textContent=a[x]:e.setAttribute(x,a[x]);}(k||[]).forEach(c=>e.appendChild(c));return e;}
const $=id=>document.getElementById(id),M=DATA.meta,D=DATA.derived,L=DATA.deadline;
$("eyebrow").textContent=M.eyebrow;$("title").textContent=M.title;$("lede").textContent=M.lede;
[[String(D.days_left),"days to "+L.date_label.replace(/^renews$/,"renewal")]].concat(DATA.facts.map(f=>[f.value,f.label]),[[String(D.options),"ways forward"]]).forEach(x=>$("kpis").appendChild(el("div",{class:"card kpi"},[el("b",{text:x[0]}),el("span",{text:x[1]})])));
$("clock").appendChild(el("div",{},[el("b",{style:"font:400 30px Georgia,serif",text:L.today}),el("div",{class:"sub",text:"today"})]));
const bar=el("div",{class:"bar"},[el("i",{style:"width:"+D.elapsed_pct+"%"}),el("u",{style:"left:"+D.ask_by_pct+"%"})]);$("clock").appendChild(bar);
$("clock").appendChild(el("div",{},[el("b",{style:"font:400 30px Georgia,serif;color:var(--R)",text:L.date}),el("div",{class:"sub",text:L.date_label})]));
$("clocknote").textContent="Red line ("+L.ask_by+"): "+L.ask_by_note+".";
DATA.options.forEach((o,i)=>{const c=el("div",{class:"opt"+(o.recommended?" rec":"")},[
 el("span",{class:"badge",style:"background:"+(o.recommended?"var(--G)":"var(--N)"),text:o.recommended?"Recommended":"Option "+(i+1)}),
 el("h3",{text:o.title}),el("ul",{class:"g"},[el("li",{text:o.pro})]),el("ul",{class:"c"},[el("li",{text:o.con})]),el("div",{class:"sub",text:o.note})]);$("opts").appendChild(c);});
$("why").textContent=DATA.why;
DATA.needs.forEach(r=>{const tr=el("tr");[r.need,r.from,r.by].forEach(c=>tr.appendChild(el("td",{text:c})));document.querySelector("#needs tbody").appendChild(tr);});
if(DATA.reply){$("replybox").appendChild(el("h2",{text:"The reply to "+DATA.reply.to+" (draft, a human posts it)"}));$("replybox").appendChild(el("pre",{text:DATA.reply.text}));}
const g=Object.keys(DATA.glossary);if(g.length){$("glossbox").appendChild(el("h2",{text:"In plain words"}));const dl=el("dl",{class:"gloss"});g.forEach(k=>{dl.appendChild(el("dt",{text:k}));dl.appendChild(el("dd",{text:DATA.glossary[k]}));});$("glossbox").appendChild(dl);}
$("foot").textContent=M.foot+" The recommendation is the author's judgement and has not been tested.";
</script></body></html>
