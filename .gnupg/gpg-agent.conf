# GPG Agent Configuration - Extended Cache Timeouts
# ================================================

# Pinentry program
pinentry-program /usr/bin/pinentry-tty
allow-loopback-pinentry

# Cache timeouts (24 hours = 86400 seconds)
default-cache-ttl 86400
max-cache-ttl 86400

# SSH keys (separate TTLs; defaults are 30min idle / 2h max)
default-cache-ttl-ssh 86400
max-cache-ttl-ssh 86400

# Pinentry timeout (5 minutes)
pinentry-timeout 300

# Enable SSH agent support
enable-ssh-support

# Keep the agent running
keep-display
keep-tty
